services:
  postgres:
    image: postgres:15
    container_name: bus_tracking_postgres
    restart: always
    environment:
      POSTGRES_DB: bus_tracking
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: bus_tracking_redis
    restart: always
    ports:
      - "6379:6379"

  backend:
    build: .
    container_name: bus_tracking_backend
    restart: always
    depends_on:
      - postgres
      - redis
    ports:
      - "5000:5000"
    environment:
      APP_NAME: bus-tracking-backend
      NODE_ENV: production
      PORT: 5000
      API_VERSION: v1

      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/bus_tracking
      REDIS_URL: redis://redis:6379

      JWT_ACCESS_SECRET: your-super-secure-access-secret-min-32-chars
      JWT_REFRESH_SECRET: your-super-secure-refresh-secret-min-32-chars

      ACCESS_TOKEN_EXPIRES_IN: 15m
      REFRESH_TOKEN_EXPIRES_IN: 7d

      COOKIE_SECURE: false
      COOKIE_SAMESITE: lax
      COOKIE_DOMAIN: ""

      CORS_ORIGIN: http://localhost:3000

      DEFAULT_SPEED_KMH: 20
      ARRIVAL_RADIUS_METERS: 80
      LOCATION_DB_WRITE_INTERVAL_MS: 10000

      RL_LOGIN_WINDOW_MS: 600000
      RL_LOGIN_MAX: 20
      RL_REFRESH_WINDOW_MS: 300000
      RL_REFRESH_MAX: 120

      STOPS_CACHE_TTL_MS: 300000
      STOPS_CACHE_MAX_ENTRIES: 200

      TRIP_STATE_TTL_SECONDS: 180
      STOPS_CACHE_TTL_SECONDS: 300

      TRIP_LOCK_TTL_MS: 10000
      IDEMPOTENCY_TTL_SECONDS: 3600

    command: >
      sh -c "
      npx prisma migrate deploy &&
      npm run start
      "

volumes:
  postgres_data: